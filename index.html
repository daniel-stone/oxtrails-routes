<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OX Trails — Routes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #F5F5F5;
    --card: #FFFFFF;
    --ink: #0C0C0C;
    --ink-soft: #55565A;
    --ink-faint: #8B8C90;
    --line: #E3E3E3;
    --line-soft: #ECECEC;
    --grey: #D9D9D9;
    --grey-soft: #EDEDED;
    --route: #0C0C0C;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
    --card-radius: 14px;
    --btn-radius: 15px;
    --display: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --body: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 400; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { width: 100%; max-width: 100%; margin: 0 auto; padding: 30px clamp(16px, 3.5vw, 48px) 54px; }

  /* ---- Board layout ---- */
  .board { display: grid; grid-template-columns: 1.32fr 1fr; gap: 24px; align-items: start; }
  @media (max-width: 880px) { .board { grid-template-columns: 1fr; } }

  /* ---- Map ---- */
  .map-pane { position: sticky; top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--card-radius); overflow: hidden; box-shadow: var(--shadow); }
  @media (max-width: 880px) { .map-pane { position: static; } }
  .map-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .map-head .mh-name { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .map-head .mh-sub { font-size: 12px; color: var(--ink-faint); font-weight: 400; }
  #map { height: clamp(460px, 74vh, 880px); width: 100%; background: var(--grey-soft); z-index: 0; }
  @media (max-width: 880px) { #map { height: clamp(340px, 52vh, 520px); } }
  .leaflet-container { font-family: var(--body); }
  .map-pane.is-fullscreen { position: fixed; inset: 0; z-index: 2500; width: 100vw; height: 100vh; border: none; border-radius: 0; box-shadow: none; display: flex; flex-direction: column; }
  .map-pane.is-fullscreen #map { flex: 1 1 auto; height: auto; }
  .fs-ctrl a { display: flex; align-items: center; justify-content: center; color: var(--ink); }
  .fs-ctrl a:hover { background: var(--grey-soft); }
  .fs-ctrl svg { width: 16px; height: 16px; }
  .start-pin, .finish-pin { border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.45); }
  .start-pin { display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 700; font-size: 11px; }
  .photo-pin { width: 40px; height: 40px; border-radius: 9px; border: 2px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.5); background-size: cover; background-position: center; cursor: pointer; transition: transform .12s; }
  .photo-pin:hover { transform: scale(1.08); }
  .leaflet-popup-content { margin: 12px 12px 10px; }
  .photo-pop img { width: 100%; height: auto; border-radius: 8px; display: block; }
  .photo-pop img { cursor: zoom-in; }
  .photo-pop p { font-family: var(--body); font-size: 12.5px; color: var(--ink); margin: 9px 1px 2px; font-weight: 400; line-height: 1.4; }
  .photo-pop .pop-view { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-family: var(--body); font-size: 12px; font-weight: 500; padding: 7px 12px; border-radius: 10px; border: none; background: var(--ink); color: #fff; cursor: pointer; }
  .photo-pop .pop-view:hover { background: #000; }
  .photo-pop .pop-view svg { width: 14px; height: 14px; }

  /* ---- Lightbox (full-screen photo viewer) ---- */
  .lightbox { position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center; padding: clamp(14px, 3vw, 40px); background: rgba(8,9,8,.9); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
  .lightbox.open { display: flex; }
  .lb-fig { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 94vw; max-height: 92vh; }
  .lb-fig img { max-width: 94vw; max-height: 84vh; width: auto; height: auto; object-fit: contain; border-radius: 10px; box-shadow: 0 12px 48px rgba(0,0,0,.55); background: #1a1a1a; }
  .lb-fig figcaption { color: #F3F2EE; font-family: var(--body); font-weight: 300; font-size: 14px; text-align: center; max-width: 62ch; line-height: 1.45; }
  .lb-close, .lb-nav { position: fixed; border: none; background: rgba(255,255,255,.13); color: #fff; cursor: pointer; display: grid; place-items: center; line-height: 1; transition: background .15s; -webkit-tap-highlight-color: transparent; }
  .lb-close:hover, .lb-nav:hover { background: rgba(255,255,255,.28); }
  .lb-close { top: 18px; right: 20px; width: 44px; height: 44px; border-radius: 50%; font-size: 27px; }
  .lb-nav { top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; font-size: 30px; }
  .lb-prev { left: 20px; } .lb-next { right: 20px; }
  @media (max-width: 640px) { .lb-nav { width: 42px; height: 42px; font-size: 25px; } .lb-prev { left: 8px; } .lb-next { right: 8px; } .lb-fig img { max-height: 78vh; } }
  .lightbox:focus-visible, .lb-close:focus-visible, .lb-nav:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---- Route list ---- */
  .routes-pane { display: flex; flex-direction: column; gap: 14px; }
  .rp-head { display: flex; align-items: center; justify-content: flex-start; gap: 12px; flex-wrap: wrap; }
  .filters { display: flex; gap: 7px; flex-wrap: wrap; }
  .filters button { font-family: var(--body); font-weight: 500; font-size: 12px; padding: 6px 14px; border-radius: 20px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); transition: all .15s; }
  .filters button:hover { border-color: var(--ink); color: var(--ink); }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .route { border: 1px solid var(--line); border-radius: var(--card-radius); background: var(--card); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .route.active { border-color: var(--ink); box-shadow: var(--shadow); }
  .route-top { display: flex; width: 100%; text-align: left; gap: 15px; padding: 16px; cursor: pointer; background: none; border: none; color: inherit; font: inherit; align-items: center; }
  .idx { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--ink); color: #fff; display: grid; place-items: center; line-height: 1; }
  .idx .d { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .idx .u { font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .72; margin-top: 2px; }
  .route-id .name { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: -.01em; line-height: 1.25; }
  .route-id .meta { display: flex; gap: 7px 16px; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--ink-soft); font-weight: 400; }
  .route-id .meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .route-id .type-chip { display: inline-flex; align-items: center; gap: 5px; }
  .chev { margin-left: auto; color: var(--ink-faint); transition: transform .2s; flex: none; align-self: center; }
  .route.active .chev { transform: rotate(180deg); color: var(--ink); }

  .route-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
  .route.active .route-body { grid-template-rows: 1fr; }
  .route-body-inner { overflow: hidden; }
  .rb-pad { padding: 2px 16px 17px; border-top: 1px solid var(--line-soft); margin-top: 2px; }
  .desc { color: var(--ink-soft); font-size: 14px; margin: 14px 0; font-weight: 300; }
  .desc strong { color: var(--ink); font-weight: 500; }
  /* Description and notes arrive as HTML rendered from each route's markdown */
  .desc p, .directions p { margin: 0 0 10px; }
  .desc p:last-child, .directions p:last-child { margin-bottom: 0; }
  .desc ul, .directions ul { margin: 0 0 10px; padding-left: 20px; }
  .desc a, .directions a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .status { color: var(--ink-faint); font-size: 13.5px; font-weight: 300; padding: 14px 2px; margin: 0; }
  .status.error { color: var(--ink); }

  .notes-lbl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500; margin: 0 0 6px; }
  .directions { color: var(--ink-soft); font-size: 13.5px; font-weight: 300; margin: 0 0 16px; }
  .meta-line { color: var(--ink-soft); font-size: 13px; font-weight: 300; margin: 0 0 16px; }
  .meta-line strong { color: var(--ink); font-weight: 500; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--body); font-size: 13px; font-weight: 500; padding: 11px 18px; border-radius: var(--btn-radius); cursor: pointer; border: 1px solid transparent; text-decoration: none; letter-spacing: .01em; transition: all .15s; }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #000; }
  .btn-ghost { background: var(--grey); color: var(--ink); }
  .btn-ghost:hover { background: #cececa; }

  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: 12.5px; font-weight: 300; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <section class="map-pane" aria-label="Route map">
      <div class="map-head">
        <span class="mh-name" id="mhName">Select a route</span>
        <span class="mh-sub" id="mhSub">Oxfordshire</span>
      </div>
      <div id="map"></div>
    </section>

    <section class="routes-pane" aria-label="Route list">
      <div class="rp-head">
        <div class="filters" id="filters">
          <button data-f="all" class="on">All</button>
          <button data-f="circular">Circular</button>
          <button data-f="ptp">Point-to-point</button>
        </div>
      </div>
      <div id="routeList"></div>
    </section>
  </div>

  <footer>
    <span>OX Trails · Improving the landscape of off-road cycling in Oxfordshire.</span>
    <span>Map data © OpenStreetMap contributors</span>
  </footer>
</div>

<div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Photo viewer">
  <button class="lb-close" type="button" aria-label="Close">&times;</button>
  <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">&lsaquo;</button>
  <button class="lb-nav lb-next" type="button" aria-label="Next photo">&rsaquo;</button>
  <figure class="lb-fig">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Route data lives in routes/<id>/ and is turned into JSON by
     tools/build_routes.py. Nothing about an individual route is
     hard-coded here: to add one, add a folder, not a line of code.

     DATA_BASE has to stay absolute anywhere this markup is pasted that
     isn't the GitHub Pages site itself (a Squarespace code block, say),
     because relative paths would otherwise resolve against that host.
  ----------------------------------------------------------------*/
  var PAGES_ORIGIN = "https://daniel-stone.github.io/oxtrails-routes/";
  var SELF_HOSTED = /(^|\.)github\.io$/.test(location.hostname)
    || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  var DATA_BASE = (SELF_HOSTED ? "" : PAGES_ORIGIN) + "routes/";
  function routeUrl(id, file){ return DATA_BASE + id + "/" + file; }

  function getJSON(url){
    return fetch(url, { credentials: "omit" }).then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  /* Route prose is trusted HTML built from markdown; everything else that
     comes out of route.md is plain text and gets escaped on the way in. */
  function esc(s){ return String(s == null ? "" : s).replace(/[<>&"]/g, function(c){
    return { "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" }[c]; }); }
  function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

  /* ---- Leaflet map + base layers ---- */
  var map = L.map('map', { scrollWheelZoom: true, zoomControl: true }).setView([51.65, -1.30], 12);
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });
  var cyclosm = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
    maxZoom: 20, subdomains:'abc',
    attribution: '<a href="https://www.cyclosm.org">CyclOSM</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });
  var topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="https://opentopomap.org">OpenTopoMap</a>' });
  cyclosm.addTo(map);
  L.control.layers({ "CyclOSM": cyclosm, "OpenStreetMap": osm, "OpenTopoMap": topo }, null, { position:'topright' }).addTo(map);

  // Keep the map correctly tiled when its container changes size
  // (window resize, responsive reflow, or Squarespace sections/accordions revealing it)
  if (window.ResizeObserver){ new ResizeObserver(function(){ map.invalidateSize(); }).observe(document.getElementById('map')); }
  window.addEventListener('load', function(){ map.invalidateSize(); });

  var layerGroup = L.layerGroup().addTo(map);
  function startIcon(){ return L.divIcon({ className:'', iconSize:[22,22], iconAnchor:[11,11],
    html:'<div class="start-pin" style="width:22px;height:22px;background:'+css('--ink')+'">S</div>' }); }
  function finishIcon(){ return L.divIcon({ className:'', iconSize:[22,22], iconAnchor:[11,11],
    html:'<div class="finish-pin" style="width:22px;height:22px;background:repeating-conic-gradient(#111 0 25%, #fff 0 50%) 50%/8px 8px"></div>' }); }
  function photoIcon(thumb){ return L.divIcon({ className:'', iconSize:[40,40], iconAnchor:[20,20],
    html:'<div class="photo-pin" style="background-image:url(&quot;'+esc(thumb)+'&quot;)"></div>' }); }

  /* ---- Lightbox ---- */
  var lb=document.getElementById("lightbox"), lbImg=document.getElementById("lbImg"), lbCap=document.getElementById("lbCap");
  var lbPrev=lb.querySelector(".lb-prev"), lbNext=lb.querySelector(".lb-next");
  var lbList=[], lbIdx=0;
  function lbShow(){ var p=lbList[lbIdx]; if(!p)return; lbImg.src=p.src; lbImg.alt=p.caption||""; lbCap.textContent=p.caption||"";
    var multi=lbList.length>1; lbPrev.style.display=multi?"grid":"none"; lbNext.style.display=multi?"grid":"none"; }
  function lbOpen(list,idx){ lbList=list||[]; lbIdx=idx||0; lbShow(); lb.classList.add("open"); lb.setAttribute("aria-hidden","false"); }
  function lbClose(){ lb.classList.remove("open"); lb.setAttribute("aria-hidden","true"); lbImg.removeAttribute("src"); }
  function lbNav(d){ if(!lbList.length)return; lbIdx=(lbIdx+d+lbList.length)%lbList.length; lbShow(); }
  lb.addEventListener("click",function(e){ if(e.target===lb) lbClose(); });
  lb.querySelector(".lb-close").addEventListener("click",lbClose);
  lbPrev.addEventListener("click",function(e){ e.stopPropagation(); lbNav(-1); });
  lbNext.addEventListener("click",function(e){ e.stopPropagation(); lbNav(1); });
  document.addEventListener("keydown",function(e){ if(!lb.classList.contains("open"))return;
    if(e.key==="Escape")lbClose(); else if(e.key==="ArrowLeft")lbNav(-1); else if(e.key==="ArrowRight")lbNav(1); });

  /* ---- Full-screen map toggle ---- */
  var EXPAND_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  var COMPRESS_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
  var mapPaneEl=document.querySelector('.map-pane'), fsBtn=null;
  function setFullscreen(on){ mapPaneEl.classList.toggle('is-fullscreen',on); if(fsBtn){ fsBtn.innerHTML=on?COMPRESS_SVG:EXPAND_SVG; fsBtn.title=on?'Exit full screen':'Full screen'; }
    document.body.style.overflow=on?'hidden':''; setTimeout(function(){ map.invalidateSize(); },80); }
  var Fullscreen=L.Control.extend({ options:{position:'topleft'},
    onAdd:function(){ var c=L.DomUtil.create('div','leaflet-bar fs-ctrl'); var a=L.DomUtil.create('a','',c);
      a.href='#'; a.setAttribute('role','button'); a.setAttribute('aria-label','Full screen'); a.title='Full screen'; a.innerHTML=EXPAND_SVG; fsBtn=a;
      L.DomEvent.on(a,'click',L.DomEvent.stop); L.DomEvent.on(a,'click',function(){ setFullscreen(!mapPaneEl.classList.contains('is-fullscreen')); });
      return c; } });
  map.addControl(new Fullscreen());
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && mapPaneEl.classList.contains('is-fullscreen') && !lb.classList.contains('open')) setFullscreen(false); });
  function farApart(a,b){var dx=(a[1]-b[1])*Math.cos(a[0]*Math.PI/180),dy=a[0]-b[0];return Math.sqrt(dx*dx+dy*dy)*111000>120;}

  function showRoute(route){
    layerGroup.clearLayers();
    if(!route) return;
    var latlngs = route.track.map(function(p){return [p[0],p[1]];});
    L.polyline(latlngs, { color:'#ffffff', weight:7, opacity:.9, lineJoin:'round', lineCap:'round' }).addTo(layerGroup);
    L.polyline(latlngs, { color:css('--route'), weight:4, opacity:1, lineJoin:'round', lineCap:'round' }).addTo(layerGroup);
    var a=latlngs[0], b=latlngs[latlngs.length-1];
    L.marker(a, { icon: startIcon(), title:'Start' }).addTo(layerGroup);
    if(farApart(a,b)){ L.marker(b, { icon: finishIcon(), title:'Finish' }).addTo(layerGroup); }
    var bounds=L.latLngBounds(latlngs);
    if(route.photos){ route.photos.forEach(function(ph,pi){
      var m=L.marker([ph.lat,ph.lon], { icon: photoIcon(ph.thumb||ph.src), title: ph.caption||'Photo' });
      var pop=document.createElement('div'); pop.className='photo-pop';
      pop.innerHTML='<img src="'+esc(ph.src)+'" alt="'+esc(ph.caption)+'" loading="lazy">'
        +(ph.caption?'<p>'+esc(ph.caption)+'</p>':'')
        +'<button type="button" class="pop-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg>View full photo</button>';
      function openFull(){ lbOpen(route.photos, pi); }
      pop.querySelector('.pop-view').addEventListener('click', openFull);
      pop.querySelector('img').addEventListener('click', openFull);
      m.bindPopup(pop, { maxWidth: 260 });
      m.addTo(layerGroup);
      bounds.extend([ph.lat,ph.lon]);
    }); }
    map.invalidateSize();
    map.fitBounds(bounds.pad(0.08));
  }

  /* ---- List ---- */
  var listEl=document.getElementById("routeList");
  var summaries=[], cards={}, detailCache={}, activeId=null, filter="all";
  function mi(km){return km*0.621371;} // distances are stored in km, displayed in miles
  function fmtHours(h){ var m=Math.round(h*60);
    return m<60 ? m+" min" : Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"m":""); }
  function summaryById(id){
    for(var i=0;i<summaries.length;i++){ if(summaries[i].id===id) return summaries[i]; }
    return null; }

  var DL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';

  function buildCard(s){
    var el=document.createElement("article");
    el.className="route";
    el.innerHTML=
      '<button class="route-top" aria-expanded="false">'
      +'<span class="idx"><span class="d">'+mi(s.distanceKm).toFixed(1)+'</span><span class="u">miles</span></span>'
      +'<span class="route-id"><span class="name">'+esc(s.name)+'</span><span class="meta">'
        +'<span class="type-chip">'+(s.type==="circular"?"◯ Circular":"→ Point-to-point")+'</span>'
        +(s.ascentM!=null?'<span><b>'+s.ascentM+' m</b> climb</span>':'')
        +(s.timeHrs!=null?'<span>about <b>'+fmtHours(s.timeHrs)+'</b></span>':'')
        +(s.photoCount?'<span><b>'+s.photoCount+'</b> photo'+(s.photoCount>1?'s':'')+'</span>':'')
      +'</span></span><span class="chev" aria-hidden="true">▾</span></button>'
      +'<div class="route-body"><div class="route-body-inner"><div class="rb-pad"></div></div></div>';
    var btn=el.querySelector(".route-top");
    btn.addEventListener("click",function(){ select(s.id); });
    cards[s.id]={ el:el, btn:btn, pad:el.querySelector(".rb-pad") };
    return el;
  }

  function renderList(){
    listEl.innerHTML=""; cards={};
    var shown=summaries.filter(function(s){return filter==="all"||s.type===filter;});
    if(!shown.length){ listEl.innerHTML='<p class="status">No routes in this category yet.</p>'; return; }
    shown.forEach(function(s){ listEl.appendChild(buildCard(s)); });
    applyActive();
  }

  /* Toggling classes in place rather than rebuilding the list keeps keyboard
     focus on the header the visitor just activated. */
  function applyActive(){
    Object.keys(cards).forEach(function(id){
      var on=(id===activeId);
      cards[id].el.classList.toggle("active",on);
      cards[id].btn.setAttribute("aria-expanded",on?"true":"false");
    });
  }

  function bodyHtml(route){
    return '<div class="desc">'+route.descHtml+'</div>'
      +(route.notesHtml?'<p class="notes-lbl">Route notes</p><div class="directions">'+route.notesHtml+'</div>':'')
      +'<p class="meta-line"><strong>Start:</strong> '+esc(route.start)
        +'<br><strong>Surface:</strong> '+esc(route.surface)
        +' &nbsp;·&nbsp; <strong>Type:</strong> '+(route.type==="circular"?"Circular loop":"Point-to-point")+'</p>'
      +'<div class="actions"><a class="btn btn-primary" href="'+routeUrl(route.id,route.gpx)
        +'" download="'+esc(route.id)+'.gpx">'+DL_SVG+'Download GPX</a></div>';
  }

  function loadRoute(id){
    if(detailCache[id]) return Promise.resolve(detailCache[id]);
    return getJSON(routeUrl(id,"route.json")).then(function(route){
      // Photo paths are stored relative to the route folder.
      route.photos=(route.photos||[]).map(function(ph){
        ph.src=routeUrl(id,ph.src); ph.thumb=routeUrl(id,ph.thumb); return ph; });
      detailCache[id]=route;
      return route;
    });
  }

  function select(id){
    if(activeId===id){ activeId=null; applyActive(); setHead(null); layerGroup.clearLayers(); return; }
    activeId=id; applyActive(); setHead(summaryById(id));
    if(cards[id] && !detailCache[id]) cards[id].pad.innerHTML='<p class="status">Loading route…</p>';
    loadRoute(id).then(function(route){
      if(activeId!==id) return;   // another route was picked while this one loaded
      if(cards[id]) cards[id].pad.innerHTML=bodyHtml(route);
      showRoute(route);
    }).catch(function(err){
      if(activeId!==id) return;
      if(cards[id]) cards[id].pad.innerHTML=
        '<p class="status error">Could not load this route ('+esc(err.message)+').</p>';
    });
  }

  function setHead(s){
    document.getElementById("mhName").textContent=s?s.name:"Select a route";
    document.getElementById("mhSub").textContent=s
      ?(mi(s.distanceKm).toFixed(1)+" miles · "+(s.type==="circular"?"circular loop":"point-to-point"))
      :"Oxfordshire";
  }

  document.getElementById("filters").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
    filter=b.getAttribute("data-f");[].forEach.call(this.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b);});renderList();});

  listEl.innerHTML='<p class="status">Loading routes…</p>';
  getJSON(DATA_BASE+"index.json").then(function(data){
    summaries=data.routes||[];
    if(!summaries.length){ listEl.innerHTML='<p class="status">No routes published yet.</p>'; return; }
    // Hide the filter bar until there is enough to filter
    if(summaries.length<2){ document.getElementById("filters").style.display="none"; }
    renderList();
    select(summaries[0].id);
  }).catch(function(err){
    listEl.innerHTML='<p class="status error">Could not load the route list ('+esc(err.message)
      +'). If this keeps happening the map data may have moved.</p>';
  });
})();
</script>
</body>
</html>
